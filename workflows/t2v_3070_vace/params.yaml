# Wan 2.1 VACE 1.3B text-to-video for the Create page's Video and Cinema tabs, core nodes only.
# Source: Comfy-Org workflow_templates, templates/video_wan_vace_14B_t2v.json (MIT licence,
# https://github.com/Comfy-Org/workflow_templates). That template ships the 1.3B loaders
# (VACE 1.3B + umt5 fp8) bypassed next to the 14B ones; this graph is the template with the
# 1.3B loaders switched on and the CausVid LoRA left out, so the KSampler uses the template
# note's own defaults for no LoRA: 20 steps, cfg 6, uni_pc/simple, shift 8, 16 fps, 81 frames.
# The optional REFERENCE_IMAGE input follows Comfy-Org's video_wan_vace_14B_ref2v template
# (LoadImage into WanVaceToVideo.reference_image); without one the node is dropped.
# VACE 1.3B is trained for 480P: keep WIDTH x HEIGHT at about 832x480 (multiples of 16) and
# FRAME_COUNT at 4n+1, at most 81 (5 s).
name: t2v_3070_vace
version: 1
description: Wan 2.1 VACE 1.3B text-to-video (Comfy-Org template)
resource_class: GPU_HEAVY
input_kind: none
output_kinds: [videos]
parameters:
  DIFFUSION_MODEL: {node: "1", input: unet_name, type: str, default: wan2.1_vace_1.3B_fp16.safetensors}
  TEXT_ENCODER: {node: "2", input: clip_name, type: str, default: umt5_xxl_fp8_e4m3fn_scaled.safetensors}
  VAE: {node: "3", input: vae_name, type: str, default: wan_2.1_vae.safetensors}
  PROMPT: {node: "5", input: text, type: str, required: true}
  NEGATIVE_PROMPT: {node: "6", input: text, type: str, default: "blurry, deformed, watermark, text"}
  REFERENCE_IMAGE: {node: "20", input: image, type: str, optional_node: true}
  WIDTH: {node: "14", input: width, type: int, min: 16, max: 1280}
  HEIGHT: {node: "14", input: height, type: int, min: 16, max: 1280}
  FRAME_COUNT: {node: "14", input: length, type: int, min: 5, max: 161}
  SEED: {node: "15", input: seed, type: int, default: 0, min: 0}
  STEPS: {node: "15", input: steps, type: int, default: 20, min: 1, max: 60}
  CFG: {node: "15", input: cfg, type: float, default: 6.0, min: 0, max: 15}
  SHIFT: {node: "4", input: shift, type: float, default: 8.0, min: 0.5, max: 30}
  SAMPLER: {node: "15", input: sampler_name, type: str, default: uni_pc}
  SCHEDULER: {node: "15", input: scheduler, type: str, default: simple}
  FPS: {node: "18", input: fps, type: float, default: 16.0, min: 1, max: 60}
  OUTPUT_PREFIX: {node: "19", input: filename_prefix, type: str, default: rokkur/create}
