# Wan 2.1 VACE 1.3B video-to-video for an 8 GB RTX 3070, ComfyUI core nodes only.
# The source clip's Canny edges drive VACE as a control video, so structure and motion follow
# the source while the prompt sets the look. VACE generates from an empty latent: DENOISE does
# not apply here and is reported as ignored.
# Models (ComfyUI Desktop model manager, or Comfy-Org/Wan_2.1_ComfyUI_repackaged):
#   diffusion_models/wan2.1_vace_1.3B_fp16.safetensors
#   text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
#   vae/wan_2.1_vae.safetensors
# Wan wants WIDTH/HEIGHT in multiples of 16 and FRAME_COUNT of the form 4n+1 (VACE rounds it).
# Run `scripts/studio.ps1 comfy-check` to validate node inputs and model files on the workstation.
name: v2v_3070_quality
version: 1
description: Wan 2.1 VACE 1.3B restyle, Canny control from the source clip
resource_class: GPU_HEAVY
input_kind: video
output_kinds: [videos, images, gifs]
parameters:
  DIFFUSION_MODEL: {node: "1", input: unet_name, type: str, default: wan2.1_vace_1.3B_fp16.safetensors}
  TEXT_ENCODER: {node: "2", input: clip_name, type: str, default: umt5_xxl_fp8_e4m3fn_scaled.safetensors}
  VAE: {node: "3", input: vae_name, type: str, default: wan_2.1_vae.safetensors}
  STYLE_PROMPT: {node: "5", input: text, type: str, required: true}
  NEGATIVE_PROMPT: {node: "6", input: text, type: str, default: "blurry, deformed, watermark, text"}
  INPUT_VIDEO: {node: "10", input: file, type: str, required: true}
  WIDTH: {targets: [{node: "12", input: width}, {node: "14", input: width}], type: int, min: 16, max: 1280}
  HEIGHT: {targets: [{node: "12", input: height}, {node: "14", input: height}], type: int, min: 16, max: 1280}
  FRAME_COUNT: {node: "14", input: length, type: int, min: 1, max: 161}
  CONTROL_STRENGTH: {node: "14", input: strength, type: float, default: 1.0, min: 0, max: 2}
  SEED: {node: "15", input: seed, type: int, default: 0, min: 0}
  STEPS: {node: "15", input: steps, type: int, min: 1, max: 60}
  CFG: {node: "15", input: cfg, type: float, min: 0, max: 15}
  FPS: {node: "18", input: fps, type: float, min: 1, max: 60}
  OUTPUT_PREFIX: {node: "19", input: filename_prefix, type: str, default: rokkur/render}
