# Rökkur Studio configuration. Every key can be overridden with an environment variable:
# STUDIO_<SECTION>__<KEY>, e.g. STUDIO_GPU__VRAM_GB=24 or STUDIO_RENDER__RENDERER=comfyui.
studio:
  autonomy_level: 2          # 0 manual … 4 automatic within policy; per-channel override in DB
  data_dir: data
  log_level: INFO
  log_json: true

database:
  url: postgresql+psycopg://rokkur:rokkur@localhost:5432/rokkur

gpu:
  vram_gb: 8
  max_heavy_jobs: 1
  lease_seconds: 3600
  unload_ollama_before_heavy: true
  free_comfyui_after_heavy: true     # once per render stage, not per shot (models stay loaded between shots)
  free_comfyui_before_agents: true   # otherwise Ollama falls back to the CPU and crawls
  class_vram_gb:             # estimated VRAM per resource class, used for the lease budget
    GPU_LIGHT: 2
    GPU_MEDIUM: 5
    GPU_HEAVY: 8

comfyui:
  url: http://127.0.0.1:8188
  poll_interval_s: 1.0      # a finished shot is noticed within a second (two cheap local GETs per poll)
  timeout_s: 3600

cloud:                       # optional ComfyUI server you rent or run elsewhere (docs/cloud.md)
  enabled: false             # set STUDIO_CLOUD__ENABLED, __URL and __TOKEN in .env, never here
  vram_gb: 24                # the cloud GPU's memory, for profile checks
  price_per_hour_usd: 0      # what the provider charges, for the cost estimate; 0 = unknown
  default: local             # preselected on the New video page: local | cloud

ollama:
  url: http://127.0.0.1:11434
  model: qwen3.5:9b          # installed on the workstation (audit 2026-10-07); qwen3.5:4b if VRAM is tight

youtube:
  enabled: false
  auto_publish: false        # not used: nothing uploads without a person's click
  default_privacy: private
  allow_public: false        # needed for public uploads and scheduled releases (they go public)
  timezone: UTC              # zone for release_times and dates, e.g. Europe/Oslo
  release_times: []          # daily release slots, quoted: ["18:00"]; the dashboard suggests the next free one
  min_lead_minutes: 30       # a scheduled release must be at least this far ahead
  default_playlist_id: ""    # e.g. PLxxxx; see `youtube-playlists` or the YouTube page

agents:
  provider: ollama           # rule_based | ollama | rokkur_collective; falls back to rules if Ollama is down
  max_per_project: 8
  max_output_retries: 2

director:                    # cinematography pass + prompt compiler (docs/director.md)
  enabled: true
  framing_weight: 1.3        # shot size emphasis, e.g. (close-up shot:1.3); 1.0 = no weight
  angle_weight: 1.25         # camera angle emphasis, e.g. (low-angle shot:1.25)
  vision: auto               # auto: the DP sees a frame of each shot when the model supports images
  vision_model: ""           # optional Ollama vision model just for the DP pass
  schedule_fps: 24           # Batch Prompt Schedule export: frame 24 = one second
  schedule_interval: 24

render:
  renderer: ffmpeg_preview   # ffmpeg_preview (non-AI stand-in) | comfyui
  default_profile: RTX3070_QUALITY
  max_retries: 3             # max repair rounds per project
  stall_reports: 2           # stop repairs (you choose: keep or more rounds) after a round that gained < 0.2 QC
  max_renders_per_project: 40
  auto_tune: true            # repairs tune CFG/steps/edges/stabilizer from QC, not only the seed
  stabilize: auto            # post-render stabilizer: auto (keep only if steadier) | off | light | strong

quality:
  pass_threshold: 6.5
  min_stability: 0             # re-render shots whose stability score is below this; 0 = off
  picture_review: auto         # auto: the vision model reviews each shot's contact sheet (advisory) | off
  vision_model: ""             # empty: director.vision_model, else ollama.model (qwen3.5:9b sees images)
  contact_sheet_columns: 6

subject:                     # keeping the real main subject (docs/subject.md)
  model: u2net               # u2net (fast) | isnet-general-use (finer edges, ~3x slower on the CPU)
  download: true             # fetch the model into data/models on first use (checksum-verified)
  min_coverage: 0.01         # a mask smaller than this share of the frame means no clear subject
  max_coverage: 0.75         # larger: the subject fills the frame, so the shot is fully restyled
  grow: 0.012                # grow the mask by this share of the short side, to cover edge halos
  feather: 0.012             # soft edge width, same unit
  harmonize: 0.5             # 0 keeps the subject's colours; 1 moves them fully toward the new room

rights:
  block_unknown: true

comments:
  auto_reply_enabled: false

costs:
  max_gpu_minutes_per_project: 120
  max_cloud_gpu_minutes: 60       # per video rendered on the cloud server (docs/cloud.md)
  max_cost_per_project_usd: 0     # estimated cloud cost cap per video; 0 = no dollar cap

jobs:
  default_max_attempts: 3
  lease_seconds: 900
  backoff_base_s: 5
  backoff_max_s: 600
  poll_interval_s: 1.0
