# Wan 2.1 VACE 14B for a 24 GB cloud GPU: keeps the real main subject and restyles the room
# around it. Used instead of v2v_cloud_14b when a project keeps its subject and the studio could
# mask it (docs/subject.md). Cloud only (render profile CLOUD_14B, docs/cloud.md).
# Built from proven graphs, not from scratch: our v2v_3070_keep (its sources are listed there:
# Comfy-Org's VACE inpainting template wiring and Civitai mask recipes), node for node except
# node 1, which loads the 14B model the way v2v_cloud_14b does (from Comfy-Org's MIT
# "Wan2.1 VACE 14B video to video" template, without its CC-BY-NC CausVid LoRA).
# The model is loaded with weight_dtype fp8_e4m3fn (about 17 GB on the GPU) so it fits 24 GB.
# Models (Comfy-Org/Wan_2.1_ComfyUI_repackaged, Apache-2.0; sizes from the Hugging Face API,
# 2026-10-10):
#   diffusion_models/wan2.1_vace_14B_fp16.safetensors        34,675,323,640 bytes (32.3 GiB)
#   text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors      6,735,906,897 bytes
#   vae/wan_2.1_vae.safetensors                                  253,815,318 bytes
# Run `scripts/studio.ps1 comfy-check --cloud` to validate node inputs and model files on the server.
# SHIFT (ModelSamplingSD3), SAMPLER and SCHEDULER (KSampler) default to this graph's own
# values (8.0, uni_pc, simple); a video's advanced settings or a QC repair may change them.
name: v2v_cloud_14b_keep
version: 1
description: Wan 2.1 VACE 14B (fp8 weights) restyle of the room around the real subject (subject mask + Canny)
resource_class: GPU_HEAVY
input_kind: video
output_kinds: [videos, images, gifs]
parameters:
  DIFFUSION_MODEL: {node: "1", input: unet_name, type: str, default: wan2.1_vace_14B_fp16.safetensors}
  WEIGHT_DTYPE: {node: "1", input: weight_dtype, type: str, default: fp8_e4m3fn}
  TEXT_ENCODER: {node: "2", input: clip_name, type: str, default: umt5_xxl_fp8_e4m3fn_scaled.safetensors}
  VAE: {node: "3", input: vae_name, type: str, default: wan_2.1_vae.safetensors}
  STYLE_PROMPT: {node: "5", input: text, type: str, required: true}
  NEGATIVE_PROMPT: {node: "6", input: text, type: str, default: "blurry, deformed, watermark, text"}
  INPUT_VIDEO: {node: "10", input: file, type: str, required: true}
  MASK_VIDEO: {node: "30", input: file, type: str, required: true}
  REFERENCE_IMAGE: {node: "20", input: image, type: str, optional_node: true}
  CANNY_LOW: {node: "13", input: low_threshold, type: float, default: 0.2, min: 0.01, max: 0.99}
  CANNY_HIGH: {node: "13", input: high_threshold, type: float, default: 0.5, min: 0.01, max: 0.99}
  WIDTH: {targets: [{node: "12", input: width}, {node: "14", input: width}, {node: "32", input: width}], type: int, min: 16, max: 1280}
  HEIGHT: {targets: [{node: "12", input: height}, {node: "14", input: height}, {node: "32", input: height}], type: int, min: 16, max: 1280}
  FRAME_COUNT: {node: "14", input: length, type: int, min: 1, max: 161}
  CONTROL_STRENGTH: {node: "14", input: strength, type: float, default: 1.0, min: 0, max: 2}
  SEED: {node: "15", input: seed, type: int, default: 0, min: 0}
  STEPS: {node: "15", input: steps, type: int, min: 1, max: 60}
  CFG: {node: "15", input: cfg, type: float, min: 0, max: 15}
  SHIFT: {node: "4", input: shift, type: float, default: 8.0, min: 0.5, max: 30}
  SAMPLER: {node: "15", input: sampler_name, type: str, default: uni_pc}
  SCHEDULER: {node: "15", input: scheduler, type: str, default: simple}
  FPS: {node: "18", input: fps, type: float, min: 1, max: 60}
  OUTPUT_PREFIX: {node: "19", input: filename_prefix, type: str, default: rokkur/render}
