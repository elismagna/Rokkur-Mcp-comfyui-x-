<script>
(() => {
  const toggle = document.getElementById('theme-toggle');
  const applyTheme = value => { document.documentElement.dataset.theme = value; toggle.textContent = value === 'light' ? 'Dark appearance' : 'Light appearance'; };
  try { applyTheme(localStorage.getItem('rokkur-theme') || 'dark'); } catch { applyTheme('dark'); }
  toggle.addEventListener('click', () => { const value = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; applyTheme(value); try { localStorage.setItem('rokkur-theme', value); } catch {} });
  let dirty = false;
  document.addEventListener('input', () => { dirty = true; });
  const create = document.getElementById('create-form'), draftKey = 'rokkur-create-draft';
  if (create) {
    const fields = [...create.elements].filter(el => el.name && !['file','submit','hidden'].includes(el.type));
    try {
      if (new URLSearchParams(location.search).has('err')) {
        const draft = JSON.parse(sessionStorage.getItem(draftKey) || '{}');
        fields.forEach(el => { if (!(el.name in draft)) return;
          if (el.type === 'checkbox') el.checked = draft[el.name]; else el.value = draft[el.name];
          el.dispatchEvent(new Event('change'));
        });
        if (Object.keys(draft).length) document.getElementById('source-info').textContent = 'Your text and settings have been restored. Reselect any uploaded files.';
      }
    } catch {}
    const saveDraft = () => { const data = {}; fields.forEach(el => data[el.name] = el.type === 'checkbox' ? el.checked : el.value);
      try { sessionStorage.setItem(draftKey, JSON.stringify(data)); } catch {}
    };
    create.addEventListener('input', saveDraft); create.addEventListener('change', saveDraft);
    create.addEventListener('submit', saveDraft);
  } else if (location.pathname.startsWith('/ui/projects/proj_')) {
    try { sessionStorage.removeItem(draftKey); } catch {}
  }
  document.addEventListener('submit', e => {
    if (e.defaultPrevented || e.target.method.toLowerCase() !== 'post') return;
    if (e.target.dataset.submitting) { e.preventDefault(); return; }
    e.target.dataset.submitting = '1';
    setTimeout(() => { if (e.submitter) { e.submitter.disabled = true; e.submitter.textContent = 'Working…'; } }, 0);
  });
  document.querySelectorAll('[data-preview-target]').forEach(select => select.addEventListener('change', () => {
    const video = document.getElementById(select.dataset.previewTarget); video.pause(); video.src = select.value;
  }));
  const refresh = document.querySelector('meta[name="studio-refresh"]');
  if (refresh) setInterval(() => {
    const playing = [...document.querySelectorAll('video')].some(video => !video.paused);
    if (!dirty && !playing && !document.hidden && !document.querySelector('details[open]') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      try { sessionStorage.setItem('rokkur-scroll:' + location.pathname, String(scrollY)); } catch {}
      location.reload();
    }
  }, Number(refresh.content) * 1000);
  try { const key = 'rokkur-scroll:' + location.pathname, y = sessionStorage.getItem(key); if (y) { scrollTo(0, Number(y)); sessionStorage.removeItem(key); } } catch {}
})();
</script>
