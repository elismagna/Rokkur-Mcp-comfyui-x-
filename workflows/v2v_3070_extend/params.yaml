# Wan 2.1 VACE 1.3B video extension for an 8 GB RTX 3070, ComfyUI core nodes only.
# Continues a clip past its last frames: the control video holds the clip's last frames and
# then plain white frames; the control mask is black over the known frames (keep) and white
# over the new ones (generate), so VACE paints a continuation that starts from the real frames.
# Built from proven graphs, not from scratch:
#   - Comfy-Org's "Wan2.1 VACE first-last frame" template (video_wan_vace_flf2v.json, MIT):
#     its control video is [known frame, white frames, known frame] and its masks
#     [black, white..., black] through WanVaceToVideo; we keep the same encoding with the known
#     frames at the start only, which VACE documents as temporal extension;
#   - our v2v_3070_keep: the loaders, sampler (uni_pc, 20 steps, cfg 6, shift 8), the mask
#     video wiring (nodes 30-34) and the reference image. The Canny node and the composite
#     are left out: the control frames are real pixels, not edges.
# The studio builds the two videos with FFmpeg (pipeline/extend.py); the overlap frames are
# trimmed from the result before it is joined to the original.
# Models as v2v_3070_quality. Run `scripts/studio.ps1 comfy-check` to validate on the PC.
# Untested on a real GPU at the time of writing (docs/video-tools.md).
name: v2v_3070_extend
version: 1
description: Wan 2.1 VACE 1.3B continuation of a clip (last frames kept, new frames generated)
resource_class: GPU_HEAVY
input_kind: video
output_kinds: [videos, images, gifs]
parameters:
  DIFFUSION_MODEL: {node: "1", input: unet_name, type: str, default: wan2.1_vace_1.3B_fp16.safetensors}
  TEXT_ENCODER: {node: "2", input: clip_name, type: str, default: umt5_xxl_fp8_e4m3fn_scaled.safetensors}
  VAE: {node: "3", input: vae_name, type: str, default: wan_2.1_vae.safetensors}
  STYLE_PROMPT: {node: "5", input: text, type: str, required: true}
  NEGATIVE_PROMPT: {node: "6", input: text, type: str, default: "blurry, deformed, watermark, text"}
  INPUT_VIDEO: {node: "10", input: file, type: str, required: true}
  MASK_VIDEO: {node: "30", input: file, type: str, required: true}
  REFERENCE_IMAGE: {node: "20", input: image, type: str, optional_node: true}
  WIDTH: {targets: [{node: "12", input: width}, {node: "14", input: width}, {node: "32", input: width}], type: int, min: 16, max: 1280}
  HEIGHT: {targets: [{node: "12", input: height}, {node: "14", input: height}, {node: "32", input: height}], type: int, min: 16, max: 1280}
  FRAME_COUNT: {node: "14", input: length, type: int, min: 1, max: 161}
  CONTROL_STRENGTH: {node: "14", input: strength, type: float, default: 1.0, min: 0, max: 2}
  SEED: {node: "15", input: seed, type: int, default: 0, min: 0}
  STEPS: {node: "15", input: steps, type: int, min: 1, max: 60}
  CFG: {node: "15", input: cfg, type: float, min: 0, max: 15}
  FPS: {node: "18", input: fps, type: float, min: 1, max: 60}
  OUTPUT_PREFIX: {node: "19", input: filename_prefix, type: str, default: rokkur/extend}
