<style>
:root{color-scheme:dark;--bg:#101115;--bg2:#17181e;--card:#1b1d24;--fg:#eceef5;--muted:#a0a6b7;--line:#303440;--accent:#b5a2ff;--accent-fg:#171223;--glow:#eab77e;--ok:#7bd5ab;--bad:#ffa096;--warn:#edca87;--ok-bg:#18372c;--bad-bg:#382328;--warn-bg:#382f22;--info-bg:#2c2840;--shadow:0 8px 30px #00000012}
html[data-theme=light]{color-scheme:light;--bg:#f4f3f0;--bg2:#eae8e3;--card:#fffefa;--fg:#24262e;--muted:#626876;--line:#dcdde1;--accent:#674abb;--accent-fg:#fff;--ok:#176b46;--bad:#a53030;--warn:#855800;--ok-bg:#e3f3ea;--bad-bg:#fbe5e3;--warn-bg:#fbf0d9;--info-bg:#ece8fb}
body{font-size:14px;line-height:1.6;letter-spacing:.005em}
.side{width:224px;padding:28px 14px;background:var(--bg);border-right:1px solid var(--line)}
.brand{font-size:11px;letter-spacing:.15em;padding-bottom:25px;white-space:nowrap}
.side a.nav{padding:10px 13px;margin:4px 0;color:var(--muted);border:1px solid transparent}
.side a.nav.on{border-color:var(--line);color:var(--fg);box-shadow:none;background:var(--card)}
.cta{padding:11px;margin-bottom:22px;letter-spacing:.02em}.side .sep{padding-top:26px}
main{width:100%;max-width:1540px;padding:22px clamp(18px,3vw,50px) 70px}
.workspace-bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;margin-bottom:30px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.workspace-bar button{font-size:11px;padding:5px 10px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--glow);margin-bottom:10px}
h1{font-size:clamp(26px,3vw,38px);font-weight:650;letter-spacing:-.035em;line-height:1.16;margin:0 0 12px}
h2{font-size:15px;letter-spacing:-.01em;font-weight:600}.sub{max-width:850px;margin-bottom:28px;font-size:14px}
.card{padding:23px;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.stack>*+*{margin-top:20px}.grid,.grid2{gap:20px}.grid2{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
.tiles{gap:10px;margin:0 0 26px}.tile{padding:20px 18px;background:var(--bg2);border-color:var(--line)}
.tile b{font-size:32px;letter-spacing:-.04em;font-weight:500;margin-bottom:7px}.tile span{font-size:11px}
button,.btn,input,select,textarea{min-height:41px}button,.btn{font-size:13px;border-radius:9px;padding:9px 16px}
button.secondary,.btn.secondary{background:var(--bg2)}button:hover,.btn:hover{filter:brightness(1.12)}
input,select,textarea{background:var(--bg);font-size:13px;padding:10px 12px}textarea{min-height:105px}
input[type=checkbox],input[type=radio]{min-height:0;accent-color:var(--accent)}input[type=range]{padding:0;accent-color:var(--accent)}
label{margin-top:18px;font-size:12px;color:var(--fg)}label output{float:right;color:var(--accent);font-variant-numeric:tabular-nums}
.hint{font-size:12px;line-height:1.6}.section-heading{display:flex;gap:12px;align-items:center;margin-bottom:12px}.section-heading h2,.section-heading p{margin:0}
.prompt-dialog{width:min(700px,calc(100vw - 28px));max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.prompt-dialog::backdrop{background:rgba(10,8,14,.68);backdrop-filter:blur(3px)}
.prompt-dialog-head,.prompt-dialog-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prompt-dialog-head h2{margin:0}.prompt-dialog textarea{margin-bottom:6px}
.prompt-dialog-actions{justify-content:flex-end;margin-top:12px}
.prompt-status{min-height:1.5em;margin-bottom:0}
.step-number{font-size:11px;color:var(--accent);border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;width:34px;height:34px;flex:none}
.create-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr);gap:24px;align-items:start}.creation-sidebar{position:sticky;top:22px}
.form-pair,.compare-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.upload-zone{padding:22px;border:1px dashed var(--line);border-radius:10px;background:var(--bg);display:block}.upload-zone b,.upload-zone span{display:block}.upload-zone span{color:var(--muted);font-size:11px;margin:4px 0 12px}.upload-zone input{background:transparent;border:0;padding:0;min-height:24px;font-size:12px}
#source-preview{margin-top:16px;max-height:300px}#reference-preview{max-width:150px;max-height:140px;object-fit:contain;margin-top:12px;border-radius:10px}#audio-preview{width:100%;margin-top:12px}
.launch-card{border-color:var(--accent)}.launch-button{width:100%;justify-content:space-between;margin-top:18px}
.review-player video{width:100%;max-height:400px;aspect-ratio:16/9;object-fit:contain;background:#08090c}.review-player figcaption{font-size:11px;color:var(--muted);margin:0 0 8px}.review-player figure{margin:0}
.shot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:16px}.shot-preview{border:1px solid var(--line);border-radius:10px;padding:14px}.shot-preview video{aspect-ratio:16/9;object-fit:contain}.shot-preview .row{margin-bottom:10px}
details{border-top:1px solid var(--line);padding-top:12px;margin-top:16px}summary{font-size:12px;color:var(--fg)}pre{font-size:11px;line-height:1.65;margin-top:10px}
.table-wrap{max-width:100%}td,th{padding:12px 10px;font-size:12px}td{overflow-wrap:anywhere}.card>table{display:block;overflow-x:auto}
.pipe{gap:5px}.pipe .bar{height:4px}.pipe .lbl{font-size:10px}.flash,.note{border:1px solid currentColor;border-radius:10px}
.kv{grid-template-columns:minmax(75px,max-content) minmax(0,1fr);font-size:12px;gap:7px 14px}.shotrow{padding:16px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.skip-link{position:fixed;top:-100px;left:10px;z-index:99;background:var(--card);padding:12px}.skip-link:focus{top:10px}
[hidden]{display:none!important}.empty{padding:30px 10px;font-size:13px}.pill{font-size:10px;letter-spacing:.02em}video{outline:1px solid var(--line)}
@media(max-width:1100px){.side{width:190px;padding-left:8px;padding-right:8px}.grid2{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.side{width:auto;height:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line);position:static}.brand{padding:0 12px 0 0}.side a.nav{padding:5px 9px;margin:2px}.cta{margin:0 0 0 auto;padding:7px 12px}main{padding:16px 16px 40px}.workspace-bar{margin-bottom:22px}.card{padding:18px}.create-layout{grid-template-columns:minmax(0,1fr)}.creation-sidebar{position:static}.form-pair{grid-template-columns:1fr}.compare-grid{grid-template-columns:1fr}.tiles{gap:7px}.tile{padding:14px}.tile b{font-size:25px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
