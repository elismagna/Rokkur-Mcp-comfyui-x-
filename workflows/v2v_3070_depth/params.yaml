# Wan 2.1 VACE 1.3B video-to-video for an 8 GB RTX 3070, guided by a depth map instead of edges.
# Same graph as v2v_3070_quality except node 13: Depth Anything V2 from the comfyui_controlnet_aux
# add-on turns each source frame into a depth map. Depth keeps the layout and the subject's
# shape without the outline lines Canny gives VACE, which is the suspected cause of outline/clay
# looks and broken fur and fingers (an experiment, not yet compared on real renders).
# Needs: custom_nodes/comfyui_controlnet_aux (ComfyUI Manager). The depth model downloads itself
# on first use. DEPTH_MODEL defaults to the Small model, the only Depth Anything V2 size under
# Apache-2.0; Base/Large/Giant are CC-BY-NC-4.0 (non-commercial), so keep Small for a channel
# that may earn money.
# Models otherwise as v2v_3070_quality:
#   diffusion_models/wan2.1_vace_1.3B_fp16.safetensors
#   text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
#   vae/wan_2.1_vae.safetensors
# Run `scripts/studio.ps1 comfy-check` to validate node inputs and model files on the workstation.
# SHIFT (ModelSamplingSD3), SAMPLER and SCHEDULER (KSampler) default to this graph's own
# values (8.0, uni_pc, simple), so a render that sets none of them is unchanged; a video's
# advanced settings or a QC repair may change them.
name: v2v_3070_depth
version: 2
description: Wan 2.1 VACE 1.3B restyle, depth control (Depth Anything V2) from the source clip
resource_class: GPU_HEAVY
input_kind: video
output_kinds: [videos, images, gifs]
parameters:
  DIFFUSION_MODEL: {node: "1", input: unet_name, type: str, default: wan2.1_vace_1.3B_fp16.safetensors}
  TEXT_ENCODER: {node: "2", input: clip_name, type: str, default: umt5_xxl_fp8_e4m3fn_scaled.safetensors}
  VAE: {node: "3", input: vae_name, type: str, default: wan_2.1_vae.safetensors}
  STYLE_PROMPT: {node: "5", input: text, type: str, required: true}
  NEGATIVE_PROMPT: {node: "6", input: text, type: str, default: "blurry, deformed, watermark, text"}
  INPUT_VIDEO: {node: "10", input: file, type: str, required: true}
  REFERENCE_IMAGE: {node: "20", input: image, type: str, optional_node: true}
  DEPTH_MODEL: {node: "13", input: ckpt_name, type: str, default: depth_anything_v2_vits.pth}
  WIDTH: {targets: [{node: "12", input: width}, {node: "14", input: width}], type: int, min: 16, max: 1280}
  HEIGHT: {targets: [{node: "12", input: height}, {node: "14", input: height}], type: int, min: 16, max: 1280}
  FRAME_COUNT: {node: "14", input: length, type: int, min: 1, max: 161}
  CONTROL_STRENGTH: {node: "14", input: strength, type: float, default: 1.0, min: 0, max: 2}
  SEED: {node: "15", input: seed, type: int, default: 0, min: 0}
  STEPS: {node: "15", input: steps, type: int, min: 1, max: 60}
  CFG: {node: "15", input: cfg, type: float, min: 0, max: 15}
  SHIFT: {node: "4", input: shift, type: float, default: 8.0, min: 0.5, max: 30}
  SAMPLER: {node: "15", input: sampler_name, type: str, default: uni_pc}
  SCHEDULER: {node: "15", input: scheduler, type: str, default: simple}
  FPS: {node: "18", input: fps, type: float, min: 1, max: 60}
  OUTPUT_PREFIX: {node: "19", input: filename_prefix, type: str, default: rokkur/render}
