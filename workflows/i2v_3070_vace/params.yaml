# Wan 2.1 VACE 1.3B start-frame-to-video for the Create page (animate a picture), core nodes.
# Source: Comfy-Org workflow_templates, templates/video_wan_vace_flf2v.json (MIT licence,
# https://github.com/Comfy-Org/workflow_templates), "Wan VACE FLF2V Image Batch" subgraph.
# That template builds VACE's control video as [start frame, solid-white frames, end frame]
# with a mask of [0, ones, 0]. Here only the start frame is known: [start, white x (n-1)] and
# mask [0, ones x (n-1)]. Changes from the template, all deliberate:
#   - no end frame (one image in);
#   - the template's BatchImagesNode/ComfyMathExpression/ComfySwitch nodes are replaced by the
#     long-standing core ImageBatch, so older ComfyUI builds can run it; UNKNOWN_FRAMES
#     (FRAME_COUNT - 1) is computed by the studio instead of a math node;
#   - the 14B model and lightx2v LoRA are swapped for the 1.3B model and the template's
#     non-LoRA sampler values (20 steps, cfg 6, uni_pc/simple, shift 8, 16 fps);
#   - the start image is scaled and centre-cropped to the render size (ImageScale).
# Not yet run on the workstation: `scripts/studio.ps1 comfy-check` validates nodes and files.
name: i2v_3070_vace
version: 1
description: Wan 2.1 VACE 1.3B start frame to video (Comfy-Org FLF2V template)
resource_class: GPU_HEAVY
input_kind: image
output_kinds: [videos]
parameters:
  DIFFUSION_MODEL: {node: "1", input: unet_name, type: str, default: wan2.1_vace_1.3B_fp16.safetensors}
  TEXT_ENCODER: {node: "2", input: clip_name, type: str, default: umt5_xxl_fp8_e4m3fn_scaled.safetensors}
  VAE: {node: "3", input: vae_name, type: str, default: wan_2.1_vae.safetensors}
  PROMPT: {node: "5", input: text, type: str, required: true}
  NEGATIVE_PROMPT: {node: "6", input: text, type: str, default: "blurry, deformed, watermark, text"}
  START_IMAGE: {node: "10", input: image, type: str, required: true}
  WIDTH: {targets: [{node: "11", input: width}, {node: "21", input: width}, {node: "25", input: width}, {node: "14", input: width}], type: int, min: 16, max: 1280}
  HEIGHT: {targets: [{node: "11", input: height}, {node: "21", input: height}, {node: "25", input: height}, {node: "14", input: height}], type: int, min: 16, max: 1280}
  FRAME_COUNT: {node: "14", input: length, type: int, min: 5, max: 161}
  UNKNOWN_FRAMES: {node: "23", input: amount, type: int, min: 1, max: 160}
  SEED: {node: "15", input: seed, type: int, default: 0, min: 0}
  STEPS: {node: "15", input: steps, type: int, default: 20, min: 1, max: 60}
  CFG: {node: "15", input: cfg, type: float, default: 6.0, min: 0, max: 15}
  SHIFT: {node: "4", input: shift, type: float, default: 8.0, min: 0.5, max: 30}
  SAMPLER: {node: "15", input: sampler_name, type: str, default: uni_pc}
  SCHEDULER: {node: "15", input: scheduler, type: str, default: simple}
  FPS: {node: "18", input: fps, type: float, default: 16.0, min: 1, max: 60}
  OUTPUT_PREFIX: {node: "19", input: filename_prefix, type: str, default: rokkur/create}
