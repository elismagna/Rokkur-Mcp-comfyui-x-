# Wan 2.1 VACE 14B video-to-video for a 24 GB cloud GPU, ComfyUI core nodes only. Cloud only:
# the 8 GB PC can neither hold nor load it (render profile CLOUD_14B, docs/cloud.md).
# Built from proven graphs, not from scratch:
#   - Comfy-Org's "Wan2.1 VACE 14B video to video" template (MIT,
#     github.com/Comfy-Org/workflow_templates, video_wan_vace_14B_v2v.json): the 14B diffusion
#     model in a UNETLoader, ModelSamplingSD3 shift 8, KSampler uni_pc/simple at its documented
#     non-LoRA settings (20 steps, cfg 6), WanVaceToVideo, TrimVideoLatent, CreateVideo 16 fps;
#   - our v2v_3070_quality, whose graph this is node for node except node 1, so every parameter
#     name and studio code path is the same.
# Changes from the Comfy-Org template: no CausVid LoRA (its weights are CC-BY-NC, not allowed for
# a channel that may earn money), so steps/cfg are the template's own defaults rather than the
# LoRA's 4/1; the Canny node is active (the template bypasses it) and fed from our ImageScale;
# the text encoder is the template's fp8 alternative, the same file as on the PC.
# The model is loaded with weight_dtype fp8_e4m3fn: ComfyUI casts the fp16 weights to fp8 while
# loading, about 17 GB on the GPU instead of 35 GB, so it fits 24 GB with no custom nodes.
# Comfy-Org publishes no fp8 file of VACE 14B. WEIGHT_DTYPE "default" keeps fp16 on a 48 GB GPU.
# Models (Comfy-Org/Wan_2.1_ComfyUI_repackaged on Hugging Face, Apache-2.0; sizes from the
# Hugging Face API, 2026-10-10):
#   diffusion_models/wan2.1_vace_14B_fp16.safetensors        34,675,323,640 bytes (32.3 GiB)
#     sha256 f202a5c59b8a91ada1862c46a038214f1f7f216c61ec8350d25f69b919da4307
#   text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors      6,735,906,897 bytes
#   vae/wan_2.1_vae.safetensors                                  253,815,318 bytes
# VACE 14B is trained at 480P and 720P (the 1.3B model only at 480P): the profile caps the area
# at 1280x720. Comfy-Org notes about 40 minutes for 81 frames at 720P on an RTX 4090.
# Run `scripts/studio.ps1 comfy-check --cloud` to validate node inputs and model files on the server.
# SHIFT (ModelSamplingSD3), SAMPLER and SCHEDULER (KSampler) default to this graph's own
# values (8.0, uni_pc, simple); a video's advanced settings or a QC repair may change them.
name: v2v_cloud_14b
version: 1
description: Wan 2.1 VACE 14B (fp8 weights) restyle up to 720P, Canny control from the source clip
resource_class: GPU_HEAVY
input_kind: video
output_kinds: [videos, images, gifs]
parameters:
  DIFFUSION_MODEL: {node: "1", input: unet_name, type: str, default: wan2.1_vace_14B_fp16.safetensors}
  WEIGHT_DTYPE: {node: "1", input: weight_dtype, type: str, default: fp8_e4m3fn}
  TEXT_ENCODER: {node: "2", input: clip_name, type: str, default: umt5_xxl_fp8_e4m3fn_scaled.safetensors}
  VAE: {node: "3", input: vae_name, type: str, default: wan_2.1_vae.safetensors}
  STYLE_PROMPT: {node: "5", input: text, type: str, required: true}
  NEGATIVE_PROMPT: {node: "6", input: text, type: str, default: "blurry, deformed, watermark, text"}
  INPUT_VIDEO: {node: "10", input: file, type: str, required: true}
  REFERENCE_IMAGE: {node: "20", input: image, type: str, optional_node: true}
  CANNY_LOW: {node: "13", input: low_threshold, type: float, default: 0.2, min: 0.01, max: 0.99}
  CANNY_HIGH: {node: "13", input: high_threshold, type: float, default: 0.5, min: 0.01, max: 0.99}
  WIDTH: {targets: [{node: "12", input: width}, {node: "14", input: width}], type: int, min: 16, max: 1280}
  HEIGHT: {targets: [{node: "12", input: height}, {node: "14", input: height}], type: int, min: 16, max: 1280}
  FRAME_COUNT: {node: "14", input: length, type: int, min: 1, max: 161}
  CONTROL_STRENGTH: {node: "14", input: strength, type: float, default: 1.0, min: 0, max: 2}
  SEED: {node: "15", input: seed, type: int, default: 0, min: 0}
  STEPS: {node: "15", input: steps, type: int, min: 1, max: 60}
  CFG: {node: "15", input: cfg, type: float, min: 0, max: 15}
  SHIFT: {node: "4", input: shift, type: float, default: 8.0, min: 0.5, max: 30}
  SAMPLER: {node: "15", input: sampler_name, type: str, default: uni_pc}
  SCHEDULER: {node: "15", input: scheduler, type: str, default: simple}
  FPS: {node: "18", input: fps, type: float, min: 1, max: 60}
  OUTPUT_PREFIX: {node: "19", input: filename_prefix, type: str, default: rokkur/render}
